# nginx delante de la aplicación (Docker con BINGO_BIND=127.0.0.1 o el
# servicio systemd). Copia este archivo a /etc/nginx/sites-available/bingo,
# cambia bingo.example.com por tu dominio y activa HTTPS (con redirección de
# http:// a https://) con:
#   sudo certbot --nginx --redirect -d bingo.example.com
# Si cambiaste BINGO_PORT, usa ese puerto en el upstream.

upstream bingo_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bingo.example.com;

    # El logo se sube por el panel (máximo 2 MB).
    client_max_body_size 3m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Sin esta cabecera la cookie del panel no se marca como segura en HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Tras certbot este bloque sirve HTTPS: el navegador recordará usar
    # siempre https:// (por http:// los navegadores ignoran esta cabecera).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Flujo en directo (Server-Sent Events): sin búfer ni compresión, y con un
    # tiempo de espera largo. Sin esto la pantalla pública no se actualiza
    # hasta recargarla.
    location = /api/live/stream {
        proxy_pass http://bingo_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location / {
        proxy_pass http://bingo_app;
    }
}
