services:
  bingo:
    build: .
    image: bingo-full:latest
    container_name: bingo
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      - "3000:3000"
    # NUXT_ADMIN_KEY and NUXT_SESSION_PASSWORD come from .env (see .env.example).
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      NUXT_DATA_DIR: "/data"
    # Current game, history, custom sets, card batches and the logo.
    volumes:
      - bingo_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bingo_data:
